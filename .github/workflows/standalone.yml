# Build the standalone one-file xrefer binaries (vivisect backend) for
# Linux / Windows / macOS, plus the pip wheel. Modeled on mandiant/capa's
# build workflow: PyInstaller cannot cross-compile, so each OS builds its
# own artifact in a matrix.
#
# Triggers are deliberately conservative (manual + release) so CI minutes
# are not spent on every push; flip on pull_request if/when maintainers
# want per-PR build validation.
name: build standalone

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[vivisect]"
          /tmp/smoke/bin/python -m xrefer --help
          /tmp/smoke/bin/python -c "import xrefer; print(xrefer.__version__, xrefer.available_backends())"
      - uses: actions/upload-artifact@v4
        with:
          name: xrefer-wheel
          path: dist/*

  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # oldest supported LTS -> broadest glibc compat
            artifact: xrefer-linux
            binary: xrefer
          - os: windows-latest
            artifact: xrefer-windows
            binary: xrefer.exe
          - os: macos-14            # arm64
            artifact: xrefer-macos-arm64
            binary: xrefer
          - os: macos-13            # x86_64
            artifact: xrefer-macos-x86_64
            binary: xrefer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel + PyInstaller
        shell: bash
        # Build the frozen binary against the INSTALLED wheel so the
        # standalone ships exactly what pip users get.
        run: python -m pip install "$(ls dist/*.whl)[vivisect]" pyinstaller
      - name: Build standalone binary
        shell: bash
        working-directory: .github/pyinstaller
        run: pyinstaller xrefer.spec --noconfirm
      - name: Smoke-test standalone binary
        shell: bash
        working-directory: .github/pyinstaller
        run: ./dist/${{ matrix.binary }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .github/pyinstaller/dist/${{ matrix.binary }}
